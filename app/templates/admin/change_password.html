{% extends "base.html" %}
{% block title %}Change Password - Archives World Map{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-4 offset-md-4">
        <h2>Change Password</h2>
        <form method="post" action="{{ url_for('admin.change_password_submit') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if not session.get('must_change_password') %}
            <div class="mb-3">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password"
                       class="form-control" autocomplete="current-password" required autofocus>
            </div>
            {% endif %}
            <div class="mb-3">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password"
                       class="form-control" autocomplete="new-password" required minlength="8">
            </div>
            <div class="mb-3">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-primary w-100">Save new password</button>
        </form>
        <p class="text-center" style="margin-top:15px;">
            <a href="{{ url_for('admin.dashboard') }}" class="text-body-secondary small">Cancel</a>
        </p>
    </div>
</div>
{% endblock %}
